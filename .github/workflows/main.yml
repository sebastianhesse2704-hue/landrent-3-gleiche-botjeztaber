name: LandRent Bot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: ZIP entpacken
        run: |
          mkdir -p extracted
          unzip -q LandRent_Bot_NEU_FINAL.zip -d extracted
          cp -r extracted/*/.github . 2>/dev/null || true
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -print -quit | xargs dirname)
          cp -r "$PROJECT_DIR"/. .
          echo "Projekt gefunden: $PROJECT_DIR"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: APK bauen
        run: |
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          gradle --no-daemon :app:assembleDebug

      - name: APK prüfen
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LandRent-Bot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
